<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1f2937">

    <title>مكتب المحاماة</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div>
        <h1>⚖️ مكتب المحاماة</h1>
        <p>نظام إدارة المكتب</p>
    </div>

    <button id="menuButton">☰</button>

</header>


<main class="container">

    <section class="search-box">

        <input
            id="globalSearch"
            type="search"
            placeholder="🔎 ابحث في بيانات المكتب..."
        >

    </section>


    <section class="dashboard">

        <button class="module">
            <span>👥</span>
            <strong>العملاء</strong>
            <small>إدارة العملاء</small>
        </button>


        <button class="module">
            <span>⚖️</span>
            <strong>القضايا</strong>
            <small>إدارة القضايا</small>
        </button>


        <button class="module">
            <span>📅</span>
            <strong>الجلسات</strong>
            <small>جلسات اليوم والمواعيد</small>
        </button>


        <button class="module">
            <span>👤</span>
            <strong>الخصوم</strong>
            <small>بيانات الخصوم</small>
        </button>


        <button class="module">
            <span>📋</span>
            <strong>الإجراءات</strong>
            <small>متابعة الإجراءات</small>
        </button>


        <button class="module">
            <span>📊</span>
            <strong>التقارير</strong>
            <small>تقارير المكتب</small>
        </button>


        <button class="module">
            <span>💾</span>
            <strong>النسخ الاحتياطي</strong>
            <small>نسخ واستعادة البيانات</small>
        </button>


        <button class="module">
            <span>⚙️</span>
            <strong>الإعدادات</strong>
            <small>إعدادات البرنامج</small>
        </button>

    </section>


    <section class="today">

        <h2>📅 جلسات اليوم</h2>

        <div id="todayHearings">

            <p class="empty">
                لا توجد جلسات مسجلة لليوم.
            </p>

        </div>

    </section>

</main>


<footer>

    <p>Law Office Manager — الإصدار 0.1</p>

</footer>


<script src="app.js"></script>

</body>
</html>
